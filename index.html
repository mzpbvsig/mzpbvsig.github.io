    :root {

      --surface: #11141b;

      --text: #f4f6fb;
      --muted: #9ba3b4;
      --line: rgba(255, 255, 255, 0.09);
      --blue: #7aa2ff;
      --green: #66d9a7;
      --amber: #f6c56b;
      --rose: #ff8f9d;
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:

      color: var(--text);

      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .shell {
      width: min(calc(100% - 40px), var(--max));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-decoration: none;
    }

    .brand-mark {
      width: 9px;
      height: 24px;
      border-radius: 99px;
      background: linear-gradient(180deg, var(--blue), var(--green));
      box-shadow: 0 0 22px rgba(122, 162, 255, 0.45);
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      transition: color 160ms ease;
    }

    .repo-link:hover { color: var(--text); }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 64px;
      align-items: end;
      padding: 88px 0 70px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(42px, 7vw, 82px);
      font-weight: 790;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    .hero-copy {
      max-width: 680px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.8;
    }

    .stats {
      display: grid;
      min-width: 185px;
      border-left: 1px solid var(--line);
    }

    .stat {
      padding: 12px 0 12px 24px;
    }

    .stat + .stat { border-top: 1px solid var(--line); }

    .stat strong {
      display: block;
      font-size: 27px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .library {
      padding: 34px 0 90px;
      border-top: 1px solid var(--line);
    }

    .library-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.025em;
    }

    #result-count {
      margin-left: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .search {
      position: relative;
      width: min(100%, 330px);
    }

    .search svg {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 17px;
      height: 17px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 43px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      background: rgba(17, 20, 27, 0.72);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .search input::placeholder { color: #71798a; }

    .search input:focus {
      border-color: rgba(122, 162, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.1);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin: 0 0 28px;
      padding: 0;
      overflow-x: auto;
      list-style: none;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      transition: 160ms ease;
    }

    .filter:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text);
    }

    .filter[aria-pressed="true"] {
      border-color: rgba(122, 162, 255, 0.45);
      background: rgba(122, 162, 255, 0.12);
      color: #cbd8ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      display: flex;
      min-height: 244px;
      flex-direction: column;
      padding: 23px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(23, 27, 36, 0.94), rgba(17, 20, 27, 0.88));
      text-decoration: none;
      transition: border-color 180ms ease, transform 180ms ease, background 180ms ease;
    }

    .card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 3px;
      background: var(--accent, var(--blue));
      content: "";
      opacity: 0.8;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.19);
      background: linear-gradient(145deg, rgba(29, 34, 45, 0.98), rgba(18, 22, 30, 0.94));
      transform: translateY(-3px);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .category {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tag {
      padding: 5px 8px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .tag-official {
      border-color: rgba(122, 162, 255, 0.25);
      background: rgba(122, 162, 255, 0.09);
      color: #a9c0ff;
    }

    .tag-practice {
      border-color: rgba(102, 217, 167, 0.25);
      background: rgba(102, 217, 167, 0.08);
      color: #8de6bd;
    }

    .tag-optional {
      border-color: rgba(246, 197, 107, 0.24);
      background: rgba(246, 197, 107, 0.08);
      color: #f6ce84;
    }

    .card h3 {
      margin: 28px 0 12px;
      font-size: 19px;
      line-height: 1.43;
      letter-spacing: -0.018em;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .open {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: auto;
      padding-top: 24px;
      color: #d8deea;
      font-size: 12px;
      font-weight: 700;
    }

    .open span {
      transition: transform 160ms ease;
    }

    .card:hover .open span { transform: translateX(3px); }

    .empty {
      display: none;
      padding: 64px 20px;
      border: 1px dashed var(--line);
      border-radius: 15px;
      color: var(--muted);
      text-align: center;

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 28px 0 42px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 44px;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .stat { padding: 18px 18px 0 0; }
      .stat + .stat { border-top: 0; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .shell { width: min(calc(100% - 28px), var(--max)); }
      .topbar { min-height: 62px; }
      .repo-link span { display: none; }
      .hero { padding: 64px 0 52px; }
      h1 { font-size: clamp(40px, 13vw, 62px); }
      .library-head { align-items: stretch; flex-direction: column; }
      .search { width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 220px; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

      const matches = articles.filter((article) => {
        const inCategory = activeFilter === "all" || article.category === activeFilter;
        const haystack = `${article.title} ${article.label} ${article.description}`.toLocaleLowerCase("zh-CN");
        return inCategory && (!query || haystack.includes(query));
      });

      grid.innerHTML = matches.map((article) => {
        const tag = typeMeta[article.type];
        return `
          <a class="card" href="${encodeURI(article.file)}" style="--accent:${accent[article.category]}">
            <div class="card-top">
              <span class="category">${article.label}</span>
              <span class="tag ${tag.className}">${tag.label}</span>
            </div>
            <h3>${article.title}</h3>
            <p>${article.description}</p>
            <span class="open">阅读全文 <span aria-hidden="true">→</span></span>
          </a>
        `;
      }).join("");

      count.textContent = `· ${matches.length} 篇`;
      empty.style.display = matches.length ? "none" : "block";
    }

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        filterButtons.forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        render();
      });
    });

    search.addEventListener("input", render);
    document.querySelector("#year").textContent = new Date().getFullYear();
    render();
  </script>
</body>
</html>
